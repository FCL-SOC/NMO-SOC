name: Tempus
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: tempus, cancel-in-progress: false}
jobs:
  tempus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install fonttools
      - run: mkdir dist && cd dist && python ../tempus.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: crazy-max/ghaction-github-pages@v4
        with: {target_branch: tempus, build_dir: dist}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
