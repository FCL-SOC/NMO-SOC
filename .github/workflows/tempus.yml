name: Tempus
on:
  schedule: [{cron: "5 0 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tempus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir dist && python tempus.py && mv dicta.svg dist/
      - uses: crazy-max/ghaction-github-pages@v4
        with: {target_branch: tempus, build_dir: dist}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
