name: Numeri et Serpens
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: [master]}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir dist && python numeri.py && mv numeri.svg linguae.svg dist/
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        continue-on-error: true
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", USERNAME: "${{ github.repository_owner }}"}
      - run: cp profile-3d-contrib/profile-night-rainbow.svg dist/horizon.svg || true
      - uses: crazy-max/ghaction-github-pages@v4
        with: {target_branch: output, build_dir: dist}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
