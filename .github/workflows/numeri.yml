name: Numeri et Serpens
on:
  schedule: [{cron: "0 0 * * 1"}]  # Lunae 00:00 UTC; porta infra elegit hebdomades alternas
  workflow_dispatch:
  push: {branches: [master]}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: porta
        run: |
          s=$(( $(date -u +%s) / 604800 ))
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ $(( s % 2 )) -eq 1 ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.porta.outputs.go == 'yes'
      - run: mkdir dist && python numeri.py && MODE=github python numeri.py && MODE=gitlab python numeri.py && (mv gh-*.svg gl-*.svg gh-COMMISSIONES.md gl-COMMISSIONES.md dist/ || true) && mv actio.svg numeri.svg linguae.svg bullae.svg urbs.svg columnae.svg titulus.svg COMMISSIONES.md dist/ && (mv summa.svg dist/ || true)
        if: steps.porta.outputs.go == 'yes'
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GITLAB_TOKEN: "${{ secrets.GITLAB_TOKEN }}"}
      - uses: Platane/snk/svg-only@v3
        if: steps.porta.outputs.go == 'yes'
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        if: steps.porta.outputs.go == 'yes'
        continue-on-error: true
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", USERNAME: "${{ github.repository_owner }}"}
      - run: cp profile-3d-contrib/profile-night-rainbow.svg dist/horizon.svg || true
        if: steps.porta.outputs.go == 'yes'
      - uses: crazy-max/ghaction-github-pages@v4
        if: steps.porta.outputs.go == 'yes'
        with: {target_branch: output, build_dir: dist}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
