name: Numeri et Serpens
on:
  schedule: [{cron: "0 0 * * 1"}]  # Lunae 00:00 UTC; porta infra elegit hebdomades alternas
  workflow_dispatch:
  push: {branches: [master]}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: porta
        run: |
          s=$(( $(date -u +%s) / 604800 ))
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ $(( s % 2 )) -eq 1 ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.porta.outputs.go == 'yes'
      - run: pip install fonttools
        if: steps.porta.outputs.go == 'yes'
      - run: mkdir dist && cd dist && python ../numeri.py && MODE=github python ../numeri.py && MODE=gitlab python ../numeri.py
        if: steps.porta.outputs.go == 'yes'
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GITLAB_TOKEN: "${{ secrets.GITLAB_TOKEN }}"}
      - uses: Platane/snk/svg-only@v3
        if: steps.porta.outputs.go == 'yes'
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#b45309&color_dots=#e9e0fb,#c4b5fd,#a78bfa,#7c3aed,#4c1d95
            dist/snake-dark.svg?palette=github-dark&color_snake=#f5c542&color_dots=#241a3d,#4c1d95,#6d28d9,#8b5cf6,#ddd6fe
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        if: steps.porta.outputs.go == 'yes'
        continue-on-error: true
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", USERNAME: "${{ github.repository_owner }}"}
      - run: cp profile-3d-contrib/profile-night-view.svg dist/horizon.svg || true
        if: steps.porta.outputs.go == 'yes'
      - uses: crazy-max/ghaction-github-pages@v4
        if: steps.porta.outputs.go == 'yes'
        with: {target_branch: output, build_dir: dist}
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
